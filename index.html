<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>聚餐菜单</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;background:#f7f5f2;color:#2c2c2c}
#home{padding:50px 16px 30px}
#home h1{font-size:26px;font-weight:700}
#home p{font-size:13px;color:#999;margin:4px 0 18px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g .cd{padding:22px 10px 16px;border-radius:14px;text-align:center;color:#fff}
.g .cd .ic{font-size:34px;display:block;margin-bottom:8px}
.g .cd .nm{font-weight:600;font-size:16px}
.g .cd .ct{font-size:12px;opacity:.7;margin-top:2px}
.s0{background:linear-gradient(135deg,#43b581,#2d8f63)}
.s1{background:linear-gradient(135deg,#ff6b35,#e85d2c)}
.s2{background:linear-gradient(135deg,#4a90d9,#357abd)}
.s3{background:linear-gradient(135deg,#9b8ec9,#7b6faf)}
.s4{background:linear-gradient(135deg,#f4a261,#e8924a)}
.b{margin-top:14px;display:flex;gap:10px}
.b button{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:600;border:none}
.o{background:#ff6b35;color:#fff}
.d{background:#1a1a1a;color:#fff}
#det{display:none;padding:0 16px}
.dh{padding:50px 0 14px;display:flex;align-items:center}
.dh .bk{width:34px;height:34px;border-radius:50%;background:#eee;border:none;font-size:20px;cursor:pointer}
.dh .tl{flex:1;text-align:center;font-size:19px;font-weight:700}
#da{padding-bottom:16px}
.r{border-radius:12px;margin-bottom:10px;padding:10px;display:flex;align-items:center}
.r0{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.r .p{width:68px;height:68px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#f0efed;cursor:pointer}
.r .p img{width:100%;height:100%;object-fit:cover;display:block}
.r .f{flex:1;margin-left:12px;font-size:15px;font-weight:600}
.r .f i{display:none;font-size:15px;padding:4px 6px;border:1.5px dashed #ff6b35;border-radius:6px;outline:none;width:100%;background:#fffaf5;font-style:normal}
.ra{border:2px dashed #ddd;padding:18px;color:#bbb;font-size:14px;cursor:pointer}
.em{text-align:center;padding:50px 20px;color:#bbb;font-size:14px}
.ac{padding:10px 0 25px;display:flex;gap:10px}
.ac button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:none}
.e2{background:#eee;color:#333}
.e2.on{background:#ff6b35;color:#fff}
.sv2{background:#1a1a1a;color:#fff}
</style></head><body>
<div id="home">
<h1>&#x1F962; 今晚吃什么</h1>
<p>点分类选菜 - 编辑后可保存分享</p>
<div class="g">
<div class="cd s0" onclick="op('0')"><span class="ic">&#x1F957;</span><div class="nm">凉菜</div><div class="ct" id="c0">0道菜</div></div>
<div class="cd s1" onclick="op('1')"><span class="ic">&#x1F372;</span><div class="nm">热菜</div><div class="ct" id="c1">0道菜</div></div>
<div class="cd s2" onclick="op('2')"><span class="ic">&#x1F963;</span><div class="nm">汤</div><div class="ct" id="c2">0道菜</div></div>
<div class="cd s3" onclick="op('3')"><span class="ic">&#x1F35A;</span><div class="nm">主食</div><div class="ct" id="c3">0道菜</div></div>
<div class="cd s4" onclick="op('4')"><span class="ic">&#x1F95F;</span><div class="nm">点心</div><div class="ct" id="c4">0道菜</div></div>
</div>
<div class="b"><button class="o" onclick="edAll()">&#x270F;&#xFE0F; 编辑菜单</button><button class="d" onclick="exp()">&#x1F4E4; 保存并分享</button></div>
</div>
<div id="det">
<div class="dh"><button class="bk" onclick="bc()">&lsaquo;</button><div class="tl" id="dt"></div></div>
<div id="da"></div>
<div class="ac"><button class="e2" id="eBtn" onclick="tE()">&#x270F;&#xFE0F; 编辑</button><button class="sv2" onclick="sV()">&#x1F4BE; 保存</button></div>
</div>
<script>
var names=["凉菜","热菜","汤","主食","点心"];
var data=[[],[],[],[],[]];
var cur=0,edit=false;

function op(i){cur=parseInt(i);edit=false;
document.getElementById("dt").textContent=names[cur];
document.getElementById("eBtn").textContent="\u270F\uFE0F 编辑";
document.getElementById("eBtn").className="e2";
document.getElementById("home").style.display="none";
document.getElementById("det").style.display="block";render();}

function render(){var a=document.getElementById("da");var it=data[cur];a.innerHTML="";
if(edit){
  for(var i=0;i<5;i++){
    if(i<it.length&&it[i]&&it[i].n){
      var d=it[i];
      a.innerHTML+='<div class="r r0"><div class="p" onclick="pk('+i+')"><img src="'+d.m+'"></div><div class="f">'+esc(d.n)+'<i><input type="text" value="'+esc(d.n)+'" maxlength="20" id="ni'+i+'" style="width:100%;border:none;outline:none;background:transparent;font:inherit"></i></div></div>';
    } else {
      a.innerHTML+='<div class="r ra" onclick="ad('+i+')">+ 点击添加菜品</div>';
    }
  }
} else {
  if(it.length==0||!it.some(function(x){return x&&x.n;})){a.innerHTML='<div class="em">还没有菜品<br>点击下方「编辑」开始添加</div>';return;}
  for(var i=0;i<it.length;i++){if(!it[i]||!it[i].n)continue;
    a.innerHTML+='<div class="r r0"><div class="p"><img src="'+it[i].m+'"></div><div class="f">'+esc(it[i].n)+'</div></div>';}
  updateHome();}
}

function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML;}

function ad(idx){var inp=document.createElement("input");
inp.type="file";inp.accept="image/*";
inp.onchange=function(e){var f=e.target.files[0];if(!f)return;
var r=new FileReader();r.onload=function(ev){
var img=new Image();img.onload=function(){
var w=img.width,h=img.height;if(w>600){h=h*600/w;w=600;}
var c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
var b64=c.toDataURL("image/jpeg",0.7);
var arr=data[cur];arr.splice(idx,0,{n:"新菜品",m:b64});
if(arr.length>5)data[cur]=arr.slice(0,5);render();
setTimeout(function(){var x=document.getElementById("ni"+idx);if(x){x.focus();x.select();}},300);
};img.src=ev.target.result;};r.readAsDataURL(f);};inp.click();}

function pk(idx){var inp=document.createElement("input");
inp.type="file";inp.accept="image/*";
inp.onchange=function(e){var f=e.target.files[0];if(!f)return;
var r=new FileReader();r.onload=function(ev){
var img=new Image();img.onload=function(){
var w=img.width,h=img.height;if(w>600){h=h*600/w;w=600;}
var c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
data[cur][idx].m=c.toDataURL("image/jpeg",0.7);render();
};img.src=ev.target.result;};r.readAsDataURL(f);};inp.click();}

function tE(){edit=!edit;var b=document.getElementById("eBtn");
b.textContent=edit?"\u2705 完成编辑":"\u270F\uFE0F 编辑";
b.className=edit?"e2 on":"e2";render();}

function sV(){for(var i=0;i<(data[cur]||[]).length;i++){
var n=document.getElementById("ni"+i);
if(n&&n.value.trim())data[cur][i].n=n.value.trim();}
edit=false;
document.getElementById("eBtn").textContent="\u270F\uFE0F 编辑";
document.getElementById("eBtn").className="e2";render();updateHome();}

function bc(){document.getElementById("det").style.display="none";
document.getElementById("home").style.display="block";updateHome();}

function updateHome(){for(var i=0;i<5;i++){
var el=document.getElementById("c"+i);
if(el)el.textContent=(data[i]?data[i].filter(function(x){return x&&x.n;}).length:0)+"\u9053\u83DC";}}

function edAll(){op(0);edit=true;
document.getElementById("eBtn").textContent="\u2705 完成编辑";
document.getElementById("eBtn").className="e2 on";render();}

function exp(){var items=[];
for(var i=0;i<5;i++){
var arr=data[i]||[];
var filtered=[];
for(var j=0;j<arr.length;j++){if(arr[j]&&arr[j].n)filtered.push(arr[j]);}
items.push(filtered);}
var json=JSON.stringify(items);
var html='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Menu</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f7f5f2;color:#333;padding:40px 16px}h1{font-size:24px;margin-bottom:20px}.s{margin-bottom:24px}.s h2{font-size:18px;margin-bottom:10px;padding-left:8px;border-left:3px solid #ff6b35}.d{background:#fff;border-radius:10px;margin-bottom:8px;padding:10px;display:flex;align-items:center}.d img{width:60px;height:60px;border-radius:8px;object-fit:cover;margin-right:12px;background:#eee}.d .t{font-size:15px;font-weight:600}.e{text-align:center;color:#bbb;padding:20px;font-size:14px}</style></head><body><h1>&#x1F962; Menu</h1>';
var cnames=["凉菜","热菜","汤","主食","点心"];
for(var i=0;i<5;i++){
html+='<div class="s"><h2>'+cnames[i]+'</h2>';
if(items[i].length===0){html+='<div class="e">-</div>';}
else{for(var j=0;j<items[i].length;j++){
html+='<div class="d"><img src="'+items[i][j].m+'" alt=""><div class="t">'+esc(items[i][j].n)+'</div></div>';}}
html+='</div>';}
html+='</body></html>';
var blob=new Blob([html],{type:"text/html;charset=utf-8"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);
var d=new Date();a.download="menu.html";
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);}

updateHome();
</script></body></html>
